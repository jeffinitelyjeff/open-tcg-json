name: Ingest TCG+
env:
  START_TS: ""
  DISCORD_MSG_START: ""
  DISCORD_MSG_SUCCESS: ""
  DISCORD_MSG_FAIL: ""
  DISCORD_MSG_CANCEL: ""
  COMMIT_HASH: ""
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional note explaining why this ingestion was triggered."
        required: false
        default: ""
jobs:
  ingest-tcg-plus:
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
      - name: check out repo
        uses: actions/checkout@v3

      - name: log trigger reason
        if: ${{ github.event.inputs.reason != '' }}
        run: |
          echo "Trigger reason: ${{ github.event.inputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

      - name: get start timestamp
        id: start_ts
        run: |
          ts=$(date +'%s')
          echo "START_TS=$ts" >> "$GITHUB_ENV"

      - name: set discord start message
        run: python -m lib.scrapy.scripts.set_discord_msg --start --job tcg_plus

      - name: discord notification (start)
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_NOTIFICATION_URL }}
          content: ${{ env.DISCORD_MSG_START }}

      - name: update apt
        run: sudo apt-get update

      - name: install poetry
        run: pipx install poetry

      - name: set up python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
          cache: "poetry"

      - name: display python version
        run: python -c "import sys; print(sys.version)"

      - name: install python dependencies
        run: poetry install --no-interaction --no-ansi

      - name: run scrapy (tcg_plus full)
        run: poetry run python -m lib.scrapy.scripts.run_scrapy --tcg_plus

      - name: archive logs (tcg_plus ingest)
        uses: actions/upload-artifact@v4
        with:
          name: logs-tcg-plus-ingest
          path: logs

      - name: pull latest changes with rebase
        run: |
          git fetch origin ${{ github.ref_name }}
          git pull --rebase --autostash origin ${{ github.ref_name }}

      - name: commit and push tcg_plus output
        id: git-commit-tcg
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🤖 tcg_plus ingest update"

      - name: set discord end messages
        if: ${{ always() }}
        env:
          COMMIT_HASH: ${{ steps.git-commit-tcg.outputs.commit_hash }}
        run: |
          python -m lib.scrapy.scripts.set_discord_msg --end --job tcg_plus --commit-hash "$COMMIT_HASH"

      - name: discord success notification
        if: ${{ success() }}
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_NOTIFICATION_URL }}
          content: ${{ env.DISCORD_MSG_SUCCESS }}

      - name: discord failure notification
        if: ${{ failure() }}
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_NOTIFICATION_URL }}
          content: ${{ env.DISCORD_MSG_FAIL }}

      - name: discord cancel notification
        if: ${{ cancelled() }}
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_NOTIFICATION_URL }}
          content: ${{ env.DISCORD_MSG_CANCEL }}
