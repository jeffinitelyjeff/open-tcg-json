name: Poll TCG+
on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  schedule:
    # run every day at 00:25 UTC
    # avoiding popular 00:00 github actions timeslot
    - cron: "25 0 * * *"
jobs:
  poll-tcg-plus:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: check out repo
        uses: actions/checkout@v3

      - name: update apt
        run: sudo apt-get update

      - name: install poetry
        run: pipx install poetry

      - name: set up python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
          cache: "poetry"

      - name: display python version
        run: python -c "import sys; print(sys.version)"

      - name: install python dependencies
        run: poetry install --no-interaction --no-ansi

      - name: run scrapy (tcg_plus list-only)
        run: poetry run python -m lib.scrapy.scripts.run_scrapy --tcg_plus --list-only

      - name: detect tcg_plus changes
        id: detect-tcg-plus-changes
        run: |
          status_output=$(git status --porcelain dataSources/tcgPlus)
          if [[ -n "$status_output" ]]; then
            change_count=$(echo "$status_output" | wc -l | tr -d ' ')
            echo "CHANGE_COUNT=$change_count" >> "$GITHUB_ENV"
            echo "change_count=$change_count" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "change_count=0" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: archive logs (tcg_plus)
        uses: actions/upload-artifact@v4
        with:
          name: logs-tcg-plus
          path: logs

      - name: trigger ingest workflow
        if: ${{ steps.detect-tcg-plus-changes.outputs.has_changes == 'true' }}
        uses: actions/github-script@v7
        env:
          CHANGE_COUNT: ${{ steps.detect-tcg-plus-changes.outputs.change_count }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const changeCount = Number(process.env.CHANGE_COUNT || '0');
            const reason = `Git changes detected (${changeCount}) by poll run #${context.runNumber}`;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ingest-tcg-plus.yaml",
              ref: context.ref,
              inputs: { reason },
            });
            core.info(`Triggered ingest-tcg-plus workflow on ${context.ref} (changes: ${changeCount}).`);

      - name: summarize ingest trigger
        if: ${{ steps.detect-tcg-plus-changes.outputs.has_changes == 'true' }}
        run: |
          echo "Detected ${{ steps.detect-tcg-plus-changes.outputs.change_count }} change(s); ingest workflow dispatched." >> "$GITHUB_STEP_SUMMARY"

      - name: summarize no changes
        if: ${{ steps.detect-tcg-plus-changes.outputs.has_changes != 'true' }}
        run: echo "No new TCG+ changes detected; ingest workflow not triggered." >> "$GITHUB_STEP_SUMMARY"
