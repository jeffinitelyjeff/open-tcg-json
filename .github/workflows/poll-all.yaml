name: Poll All
on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  schedule:
    # for poll-dcg-wiki: every hour at 25 minutes past the hour
    - cron: "25 * * * *"
    # for poll-tcg-plus and poll-dcg-main: once a day at 00:25
jobs:
  poll-dcg-wiki:
    if: github.event_name != 'schedule' || github.event.schedule == '25 * * * *'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      PYWIKIBOT_USERNAME: ${{ secrets.PYWIKIBOT_USERNAME }}
    steps:
      - name: check out repo
        uses: actions/checkout@v3

      - name: update apt
        run: sudo apt-get update

      - name: install poetry
        run: pipx install poetry

      - name: set up python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
          cache: "poetry"

      - name: display python version
        run: python -c "import sys; print(sys.version)"

      - name: install python dependencies
        run: poetry install --no-interaction --no-ansi

      - name: read last_change timestamp
        id: last_change
        run: |
          file_path="dataSources/dcgWiki/last_change.txt"
          mkdir -p "$(dirname "$file_path")"
          if [ ! -s "$file_path" ]; then
            echo "1970-01-01T00:00:00+00:00" > "$file_path"
          fi
          timestamp=$(<"$file_path")
          timestamp=${timestamp//$'\r'/}
          timestamp=${timestamp//$'\n'/}
          echo "Using last_change timestamp: $timestamp"
          echo "LAST_CHANGE=$timestamp" >> "$GITHUB_ENV"
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"

      - name: decode pywikibot password
        run: echo "${{ secrets.PYWIKIBOT_PASSWORD_BASE64 }}" | base64 -d > lib/pywikibot/user-password.py

      - name: check dcg_wiki recent changes
        id: recent_changes
        run: |
          mkdir -p logs
          output_file="logs/recent_changes.txt"
          poetry run python lib/pywikibot/recent_changes.py --since "${{ steps.last_change.outputs.timestamp }}" > "$output_file"
          if [ -s "$output_file" ]; then
            count=$(wc -l < "$output_file")
          else
            count=0
          fi
          echo "Detected $count change(s) since ${{ steps.last_change.outputs.timestamp }}"
          echo "CHANGE_COUNT=$count" >> "$GITHUB_ENV"
          echo "change_count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: archive logs (poll)
        uses: actions/upload-artifact@v4
        with:
          name: logs-dcg-wiki-poll
          path: logs

      - name: trigger archive workflow
        if: ${{ steps.recent_changes.outputs.has_changes == 'true' }}
        uses: actions/github-script@v7
        env:
          CHANGE_COUNT: ${{ steps.recent_changes.outputs.change_count }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const changeCount = Number(process.env.CHANGE_COUNT || '0');
            const reason = `Changes detected (${changeCount}) by poll run #${context.runNumber}`;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "archive-dcg-wiki.yaml",
              ref: context.ref,
              inputs: { reason },
            });
            core.info(`Triggered archive-dcg-wiki workflow on ${context.ref} (changes: ${changeCount}).`);

      - name: summarize archive trigger
        if: ${{ steps.recent_changes.outputs.has_changes == 'true' }}
        run: |
          echo "Detected ${{ steps.recent_changes.outputs.change_count }} change(s); archive workflow dispatched." >> "$GITHUB_STEP_SUMMARY"

      - name: summarize no changes
        if: ${{ steps.recent_changes.outputs.has_changes != 'true' }}
        run: echo "No new DCG Wiki changes detected; archive workflow not triggered." >> "$GITHUB_STEP_SUMMARY"

  poll-tcg-plus:
    if: github.event_name != 'schedule' || github.event.schedule == '25 0 * * *'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: check out repo
        uses: actions/checkout@v3

      - name: update apt
        run: sudo apt-get update

      - name: install poetry
        run: pipx install poetry

      - name: set up python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
          cache: "poetry"

      - name: display python version
        run: python -c "import sys; print(sys.version)"

      - name: install python dependencies
        run: poetry install --no-interaction --no-ansi

      - name: run scrapy (tcg_plus list-only)
        run: poetry run python -m lib.scrapy.scripts.run_scrapy --tcg_plus --list-only

      - name: detect tcg_plus changes
        id: detect-tcg-plus-changes
        run: |
          status_output=$(git status --porcelain dataSources/tcgPlus)
          if [[ -n "$status_output" ]]; then
            change_count=$(echo "$status_output" | wc -l | tr -d ' ')
            echo "CHANGE_COUNT=$change_count" >> "$GITHUB_ENV"
            echo "change_count=$change_count" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "change_count=0" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: archive logs (tcg_plus)
        uses: actions/upload-artifact@v4
        with:
          name: logs-tcg-plus
          path: logs

      - name: trigger archive workflow
        if: ${{ steps.detect-tcg-plus-changes.outputs.has_changes == 'true' }}
        uses: actions/github-script@v7
        env:
          CHANGE_COUNT: ${{ steps.detect-tcg-plus-changes.outputs.change_count }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const changeCount = Number(process.env.CHANGE_COUNT || '0');
            const reason = `Git changes detected (${changeCount}) by poll run #${context.runNumber}`;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "archive-tcg-plus.yaml",
              ref: context.ref,
              inputs: { reason },
            });
            core.info(`Triggered archive-tcg-plus workflow on ${context.ref} (changes: ${changeCount}).`);

      - name: summarize archive trigger
        if: ${{ steps.detect-tcg-plus-changes.outputs.has_changes == 'true' }}
        run: |
          echo "Detected ${{ steps.detect-tcg-plus-changes.outputs.change_count }} change(s); archive workflow dispatched." >> "$GITHUB_STEP_SUMMARY"

      - name: summarize no changes
        if: ${{ steps.detect-tcg-plus-changes.outputs.has_changes != 'true' }}
        run: echo "No new TCG+ changes detected; archive workflow not triggered." >> "$GITHUB_STEP_SUMMARY"

  poll-dcg-main:
    if: github.event_name != 'schedule' || github.event.schedule == '25 0 * * *'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: check out repo
        uses: actions/checkout@v3

      - name: update apt
        run: sudo apt-get update

      - name: install poetry
        run: pipx install poetry

      - name: set up python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
          cache: "poetry"

      - name: display python version
        run: python -c "import sys; print(sys.version)"

      - name: install python dependencies
        run: poetry install --no-interaction --no-ansi

      - name: run scrapy (dcg_main list-only)
        run: poetry run python -m lib.scrapy.scripts.run_scrapy --dcg_main --list-only

      - name: detect dcg_main changes
        id: detect-dcg-main-changes
        run: |
          status_output=$(git status --porcelain dataSources/dcgMain)
          if [[ -n "$status_output" ]]; then
            change_count=$(echo "$status_output" | wc -l | tr -d ' ')
            echo "CHANGE_COUNT=$change_count" >> "$GITHUB_ENV"
            echo "change_count=$change_count" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "change_count=0" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: archive logs (dcg_main)
        uses: actions/upload-artifact@v4
        with:
          name: logs-dcg-main
          path: logs

      - name: trigger archive workflow
        if: ${{ steps.detect-dcg-main-changes.outputs.has_changes == 'true' }}
        uses: actions/github-script@v7
        env:
          CHANGE_COUNT: ${{ steps.detect-dcg-main-changes.outputs.change_count }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const changeCount = Number(process.env.CHANGE_COUNT || '0');
            const reason = `Git changes detected (${changeCount}) by poll run #${context.runNumber}`;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "archive-dcg-main.yaml",
              ref: context.ref,
              inputs: { reason },
            });
            core.info(`Triggered archive-dcg-main workflow on ${context.ref} (changes: ${changeCount}).`);

      - name: summarize archive trigger
        if: ${{ steps.detect-dcg-main-changes.outputs.has_changes == 'true' }}
        run: |
          echo "Detected ${{ steps.detect-dcg-main-changes.outputs.change_count }} change(s); archive workflow dispatched." >> "$GITHUB_STEP_SUMMARY"

      - name: summarize no changes
        if: ${{ steps.detect-dcg-main-changes.outputs.has_changes != 'true' }}
        run: echo "No new DCG Main changes detected; archive workflow not triggered." >> "$GITHUB_STEP_SUMMARY"
